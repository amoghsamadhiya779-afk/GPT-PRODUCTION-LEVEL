# configs/gpt2_small.yaml
# ============================================================
#  GPT-2 Small (124M) — Configuration File
# ============================================================
#  Modify these values to experiment with different architectures
#  and training hyperparameters.
#
#  Usage:
#    py training/train.py --config configs/gpt2_small.yaml
# ============================================================

model:
  vocab_size: 50257          # GPT-2 BPE vocabulary size
  context_length: 256        # Max sequence length (reduced from 1024 for demo)
  emb_dim: 768               # Embedding dimension
  n_heads: 12                # Number of attention heads
  n_layers: 12               # Number of transformer blocks
  dropout: 0.1               # Dropout rate
  qkv_bias: false            # Bias in Q/K/V projections

training:
  learning_rate: 5.0e-4      # Peak learning rate
  num_epochs: 10             # Number of training epochs
  batch_size: 2              # Sequences per batch
  weight_decay: 0.1          # AdamW weight decay
  warmup_steps: 20           # Linear warmup steps
  max_grad_norm: 1.0         # Gradient clipping threshold
  eval_freq: 500             # Evaluate every N steps
  eval_iter: 10              # Batches per evaluation
  save_dir: checkpoints      # Checkpoint output directory
  log_dir: logs              # Logging output directory
  seed: 123                  # Random seed
