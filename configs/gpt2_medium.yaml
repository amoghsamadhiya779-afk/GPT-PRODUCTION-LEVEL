# configs/gpt2_medium.yaml
# ============================================================
#  GPT-2 Medium (355M) — Configuration File
# ============================================================
#  Usage:
#    py training/train.py --config configs/gpt2_medium.yaml
# ============================================================

model:
  vocab_size: 50257          # GPT-2 BPE vocabulary size
  context_length: 1024       # Max sequence length
  emb_dim: 1024              # Embedding dimension
  n_heads: 16                # Number of attention heads
  n_layers: 24               # Number of transformer blocks
  dropout: 0.1               # Dropout rate
  qkv_bias: true             # Bias in Q/K/V projections
  model_size: medium         # Model size identifier

training:
  learning_rate: 3.0e-4      # Peak learning rate (slightly lower for medium)
  num_epochs: 10             # Number of training epochs
  batch_size: 1              # Sequences per batch (reduced for memory)
  weight_decay: 0.1          # AdamW weight decay
  warmup_steps: 20           # Linear warmup steps
  max_grad_norm: 1.0         # Gradient clipping threshold
  eval_freq: 500             # Evaluate every N steps
  eval_iter: 10              # Batches per evaluation
  save_dir: checkpoints      # Checkpoint output directory
  log_dir: logs              # Logging output directory
  seed: 123                  # Random seed
