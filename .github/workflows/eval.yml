name: Model Eval

# Manual: downloads real GPT-2 weights (~0.5-1.5 GB), so it doesn't run on
# every push. Regular CI tests the harness itself on a tiny model.
on:
  workflow_dispatch:
    inputs:
      model_size:
        description: "Base model"
        type: choice
        options: [small, medium]
        default: small
      adapter:
        description: "Adapter in checkpoints/adapters/ ('none' for the base model)"
        default: sft_v1_small
      limit:
        description: "Items per suite (blank = all)"
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code (with LFS adapters)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Hugging Face weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-${{ inputs.model_size }}

      - name: Download and map GPT-2 weights
        env:
          MODEL_SIZE: ${{ inputs.model_size }}
        run: python training/load_pretrained.py

      - name: Run eval harness
        env:
          ADAPTER: ${{ inputs.adapter }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--checkpoint checkpoints/best_model.pt --adapter "$ADAPTER" --out reports/eval.json)
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          baseline="evals/baselines/${{ inputs.model_size }}-${ADAPTER}.json"
          if [ -f "$baseline" ]; then args+=(--baseline "$baseline"); fi
          python -m evals "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.model_size }}-${{ inputs.adapter }}
          path: reports/eval.json
          if-no-files-found: ignore
